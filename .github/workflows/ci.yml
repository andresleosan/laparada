name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar LaParada
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Configurar Java para emuladores
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        id: install
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/pnpm-install.log"
          if ! pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee "$log_file"; then
            diagnostic=$(tail -n 40 "$log_file" | tr '\n' ' ' | cut -c1-4000)
            echo "::error file=pnpm-lock.yaml,line=1,title=pnpm install::$diagnostic"
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: TypeScript frontend
        run: pnpm exec tsc --noEmit

      - name: Compilar frontend
        run: pnpm run build

      - name: Presupuesto de bundle
        run: pnpm run check:bundle

      - name: Compilar Functions
        run: pnpm run build:functions

      - name: Pruebas unitarias y de frontera
        # Las pruebas de frontera mockean módulos globales; serializar archivos evita
        # interferencias entre workers del runner sin cambiar la cobertura.
        run: pnpm exec vitest run --reporter=dot --no-file-parallelism

      - name: Reglas y pruebas de integración con emuladores
        id: rules
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/rules-test.log"
          if ! pnpm run test:rules 2>&1 | tee "$log_file"; then
            diagnostic=$(tail -n 80 "$log_file" | tr '\n' ' ' | cut -c1-6000)
            echo "::error file=firestore.rules,line=1,title=test:rules::$diagnostic"
            exit 1
          fi

      - name: Chequeo de secretos de alta confianza
        shell: bash
        run: |
          if git grep -n -I -E 'AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|sk_(live|test)_[0-9A-Za-z]+|whsec_[0-9A-Za-z]+' -- ':!tests/**' ':!*.md' ':!*.example'; then
            echo "Se detectó un posible secreto en archivos versionados."
            exit 1
          fi

      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level high
